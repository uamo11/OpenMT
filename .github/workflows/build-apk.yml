name: Build OpenMT APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Apktool & uber-apk-signer
        run: |
          mkdir -p $HOME/.local/bin
          curl -fL -o $HOME/.local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          echo '#!/bin/bash' > $HOME/.local/bin/apktool
          echo 'java -jar "$HOME/.local/bin/apktool.jar" "$@"' >> $HOME/.local/bin/apktool
          chmod +x $HOME/.local/bin/apktool
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          mkdir -p $HOME/.local/share/rea/signer
          curl -fL -o $HOME/.local/share/rea/signer/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Build, Align and Sign APK (v1 + v2 + v3)
        run: |
          python build_apk.py

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openMT-y.open.mt-apk
          path: dist/openMT-y.open.mt.apk
